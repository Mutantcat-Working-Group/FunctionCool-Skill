name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      APP_NAME: FunctionCool-Skill
    steps:
      - uses: actions/checkout@v4

      - name: Check VERSION matches the tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ "${TAG_VERSION}" != "${FILE_VERSION}" ]; then
            echo "::error::VERSION (${FILE_VERSION}) does not match tag (${TAG_VERSION})"
            exit 1
          fi

  package:
    needs: verify
    runs-on: ubuntu-latest
    env:
      APP_NAME: FunctionCool-Skill
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Package release archive
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          STAGE="staging/${APP_NAME}-${VERSION}"
          mkdir -p dist "${STAGE}"
          git archive --format=tar HEAD | tar -x -C "${STAGE}"
          tar -czf "dist/${APP_NAME}-${VERSION}.tar.gz" -C staging "${APP_NAME}-${VERSION}"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/*.tar.gz

  publish:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd release-assets
          ASSET_COUNT="$(find . -type f | wc -l | tr -d ' ')"
          if [ "${ASSET_COUNT}" -lt 1 ]; then
            echo "::error::no release assets downloaded, refusing to checksum an empty set"
            exit 1
          fi
          find . -type f -print0 | sort -z | xargs -0 -r sha256sum > ../checksums.txt
          find . -type f -print0 | sort -z | xargs -0 -r md5sum > ../checksums-md5.txt
          find . -type f -print0 | sort -z | xargs -0 -r sha1sum > ../checksums-sha1.txt
          for SUM in ../checksums.txt checksums-md5.txt checksums-sha1.txt; do
            if [ "$(wc -l < "${SUM}" | tr -d ' ')" -ne "${ASSET_COUNT}" ]; then
              echo "::error::${SUM} line count does not match the asset count"
              exit 1
            fi
          done

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" release-assets/* \
              checksums.txt checksums-md5.txt checksums-sha1.txt \
              --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${TAG}" release-assets/* \
              checksums.txt checksums-md5.txt checksums-sha1.txt \
              --repo "${GITHUB_REPOSITORY}" --title "${TAG}" --generate-notes
          fi

